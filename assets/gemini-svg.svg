<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 540 350" fill="none">
  <defs>
    <path id="sp" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z"/>
    <path id="dm" d="M0 -5 L5 0 L0 5 L-5 0Z"/>
  </defs>

  <rect x="3" y="3" width="534" height="344" rx="14" fill="#454440"/>

  <!-- marching hand-drawn border -->
  <rect x="11" y="11" width="518" height="328" rx="10" stroke="#c0392b" stroke-width="2" stroke-dasharray="10 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- floating code doodle -->
  <g font-family="Courier New, monospace" font-weight="700" fill="#5a1c1e" font-size="30">
    <text x="440" y="62">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title -->
  <g>
    <text x="34" y="52" font-family="Courier New, monospace" font-size="21" font-weight="700" fill="#e8a89a">&lt;/&gt; about me</text>
  </g>
  <path d="M34 66 q8 -7 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="#e8695c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- paragraph -->
  <g font-family="Courier New, monospace" font-size="16" fill="#f2d9d1">
    <text x="34" y="102" font-size="17" font-weight="700">Hello there! I'm <tspan fill="#e8695c">Zahra Qorbany</tspan>,</text>
    <text x="34" y="128">a front-end developer with a graphic</text>
    <text x="34" y="152">design background. I love building clean,</text>
    <text x="34" y="176">custom UIs: <tspan fill="#e8a89a">no templates, no copy-paste.</tspan></text>
  </g>

  <!-- bullets -->
  <g font-family="Courier New, monospace" font-size="15" fill="#f2d9d1">
    <use href="#dm" x="40" y="217" fill="#e8695c"/>
    <text x="56" y="222">coming from a graphic design background</text>
    
    <use href="#dm" x="40" y="243" fill="#e8695c"/>
    <text x="56" y="248">know <tspan fill="#e8a89a">React</tspan>, now learning <tspan fill="#e8a89a">TypeScript</tspan> &amp; <tspan fill="#e8a89a">Next.js</tspan></text>
    
    <use href="#dm" x="40" y="269" fill="#e8695c"/>
    <text x="56" y="274">every project's design idea is all mine</text>
    
    <use href="#dm" x="40" y="295" fill="#e8695c"/>
    <text x="56" y="300">building things that look good AND work well</text>
    
    <use href="#dm" x="40" y="321" fill="#e8695c"/>
    <text x="56" y="326">based in Iran</text>
  </g>

  <!-- blinking cursor -->
  <rect x="176" y="313" width="9" height="17" fill="#e8695c">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- twinkling sparkles -->
  <g transform="translate(496 96)">
    <use href="#sp" fill="#e8a89a">
      <animateTransform attributeName="transform" type="scale" values="0.5;1.1;0.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(500 322)">
    <use href="#sp" fill="#e8695c">
      <animateTransform attributeName="transform" type="scale" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(468 200)">
    <use href="#sp" fill="#e8a89a">
      <animateTransform attributeName="transform" type="scale" values="0.4;0.8;0.4" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
